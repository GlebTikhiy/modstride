[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "modstride"
version = "0.1.0"
description = "Evidence-driven Minecraft mod migration tools for coding agents"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "ruff>=0.11,<1", "PyYAML>=6,<7"]

[project.scripts]
modstride = "modstride.cli:main"

[tool.setuptools.packages.find]
include = ["modstride*"]
namespaces = false

[tool.setuptools.package-data]
modstride = ["data/*.json", "data/rules/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
